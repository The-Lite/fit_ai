[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-ai"
version = "0.1.0"
description = "AI-powered grocery optimization application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlflow",
    "openai",
    "psycopg[binary]",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests that require a live PostgreSQL database, MLflow server, and external API access",
]
